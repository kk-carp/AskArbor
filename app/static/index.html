<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>统一知识助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.4rem;
      }
      section {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      textarea {
        width: 100%;
        min-height: 80px;
      }
      .hint {
        color: #666;
        font-size: 0.9rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>统一知识助手</h1>
    <p class="hint">登录后提问。可检索空间由服务端按账号成员关系计算，页面不负责权限控制。</p>

    <section>
      <h2>登录</h2>
      <p id="currentUser" class="hint">正在检查登录状态...</p>
      <label for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" />
      <p class="row">
        <button id="loginBtn" type="button">登录</button>
        <button id="logoutBtn" type="button">退出</button>
      </p>
      <p id="authStatus" class="hint"></p>
    </section>

    <section>
      <h2>上传与文档管理</h2>
      <p class="hint">仅教学岗（或管理员）可上传/下线。学员与普通员工无写库权限。</p>
      <label for="space">知识空间</label>
      <select id="space">
        <option value="student">student</option>
        <option value="company">company</option>
      </select>
      <label for="file">文件（md / txt / pdf / docx）</label>
      <input id="file" type="file" />
      <p class="row">
        <button id="uploadBtn" type="button">上传</button>
        <button id="refreshDocsBtn" type="button">刷新列表</button>
      </p>
      <p id="uploadStatus" class="hint"></p>
      <ul id="docList"></ul>
    </section>

    <section>
      <h2>提问</h2>
      <label for="question">问题</label>
      <textarea id="question" placeholder="登录后再输入问题"></textarea>
      <p><button id="askBtn" type="button">提问</button></p>
      <h3>答案</h3>
      <p id="answer">请先登录并提问。</p>
      <p id="ownerInfo" class="hint"></p>
      <h3>来源</h3>
      <ul id="sources"></ul>
      <p id="askStatus" class="hint"></p>
    </section>
    <script>
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const authStatus = document.getElementById("authStatus");
      const currentUserEl = document.getElementById("currentUser");

      const spaceSelect = document.getElementById("space");
      const fileInput = document.getElementById("file");
      const uploadBtn = document.getElementById("uploadBtn");
      const refreshDocsBtn = document.getElementById("refreshDocsBtn");
      const uploadStatus = document.getElementById("uploadStatus");
      const docListEl = document.getElementById("docList");

      const questionInput = document.getElementById("question");
      const askBtn = document.getElementById("askBtn");
      const askStatus = document.getElementById("askStatus");
      const answerEl = document.getElementById("answer");
      const ownerInfoEl = document.getElementById("ownerInfo");
      const sourcesEl = document.getElementById("sources");

      let currentUser = null;

      function setAuthStatus(text, isError = false) {
        authStatus.textContent = text;
        authStatus.style.color = isError ? "#b00020" : "#666";
      }

      function setUploadStatus(text, isError = false) {
        uploadStatus.textContent = text;
        uploadStatus.style.color = isError ? "#b00020" : "#666";
      }

      function setAskStatus(text, isError = false) {
        askStatus.textContent = text;
        askStatus.style.color = isError ? "#b00020" : "#666";
      }

      function renderCurrentUser() {
        if (!currentUser) {
          currentUserEl.textContent = "未登录。演示账号：student_demo / employee_demo / teaching_demo。";
          return;
        }
        const spaces = (currentUser.allowed_spaces || []).join(", ") || "无";
        const teaching = currentUser.is_teaching ? "，教学岗" : "";
        const manage = currentUser.can_manage_documents ? "，可管理文档" : "";
        const advisor = currentUser.advisor_id ? `，班主任已绑定` : "";
        currentUserEl.textContent = `当前用户：${currentUser.username}（${currentUser.role}${teaching}${manage}${advisor}），可检索空间：${spaces}`;
      }

      async function refreshDocuments() {
        if (!currentUser || !currentUser.can_manage_documents) {
          docListEl.innerHTML = "<li class='hint'>登录教学岗后可查看文档列表。</li>";
          return;
        }
        try {
          const response = await fetch("/documents", { credentials: "same-origin" });
          const data = await response.json();
          if (response.status === 401 || response.status === 403) {
            docListEl.innerHTML = `<li class='hint'>${data.detail || "无权限"}</li>`;
            return;
          }
          if (!response.ok) {
            docListEl.innerHTML = `<li class='hint'>加载失败：${data.detail || "未知错误"}</li>`;
            return;
          }
          if (!Array.isArray(data) || data.length === 0) {
            docListEl.innerHTML = "<li class='hint'>暂无文档。</li>";
            return;
          }
          docListEl.innerHTML = "";
          for (const doc of data) {
            const item = document.createElement("li");
            const meta = document.createElement("span");
            meta.textContent = `${doc.title} | ${doc.space_id} | ${doc.status} | chunks=${doc.chunk_count}`;
            if (doc.error) {
              meta.textContent += ` | error=${doc.error}`;
            }
            item.appendChild(meta);
            if (doc.status !== "offline") {
              const offlineBtn = document.createElement("button");
              offlineBtn.type = "button";
              offlineBtn.textContent = "下线";
              offlineBtn.style.marginLeft = "0.5rem";
              offlineBtn.addEventListener("click", async () => {
                offlineBtn.disabled = true;
                try {
                  const offResp = await fetch(`/documents/${doc.id}/offline`, {
                    method: "POST",
                    credentials: "same-origin",
                  });
                  const offData = await offResp.json();
                  if (!offResp.ok) {
                    setUploadStatus(`下线失败：${offData.detail || "未知错误"}`, true);
                    return;
                  }
                  setUploadStatus(`已下线：${offData.title}`);
                  await refreshDocuments();
                } catch (_error) {
                  setUploadStatus("下线失败：网络异常。", true);
                } finally {
                  offlineBtn.disabled = false;
                }
              });
              item.appendChild(offlineBtn);
            }
            docListEl.appendChild(item);
          }
        } catch (_error) {
          docListEl.innerHTML = "<li class='hint'>加载文档列表失败：网络异常。</li>";
        }
      }

      async function refreshMe() {
        try {
          const response = await fetch("/me", { credentials: "same-origin" });
          if (response.status === 401) {
            currentUser = null;
            renderCurrentUser();
            return;
          }
          const data = await response.json();
          if (!response.ok) {
            currentUser = null;
            renderCurrentUser();
            setAuthStatus(`读取登录状态失败：${data.detail || "未知错误"}`, true);
            return;
          }
          currentUser = data;
          renderCurrentUser();
          await refreshDocuments();
        } catch (_error) {
          currentUser = null;
          renderCurrentUser();
          setAuthStatus("读取登录状态失败：网络异常。", true);
        }
      }

      loginBtn.addEventListener("click", async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
          setAuthStatus("请输入用户名和密码。", true);
          return;
        }
        loginBtn.disabled = true;
        setAuthStatus("登录中...");
        try {
          const response = await fetch("/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();
          if (!response.ok) {
            currentUser = null;
            renderCurrentUser();
            setAuthStatus(`登录失败：${data.detail || "未知错误"}`, true);
            return;
          }
          currentUser = data;
          passwordInput.value = "";
          renderCurrentUser();
          setAuthStatus("登录成功。");
          await refreshDocuments();
        } catch (_error) {
          setAuthStatus("登录失败：网络异常。", true);
        } finally {
          loginBtn.disabled = false;
        }
      });

      logoutBtn.addEventListener("click", async () => {
        logoutBtn.disabled = true;
        setAuthStatus("退出中...");
        try {
          const response = await fetch("/logout", {
            method: "POST",
            credentials: "same-origin",
          });
          if (!response.ok) {
            const data = await response.json();
            setAuthStatus(`退出失败：${data.detail || "未知错误"}`, true);
            return;
          }
          currentUser = null;
          renderCurrentUser();
          setAuthStatus("已退出。");
          docListEl.innerHTML = "";
        } catch (_error) {
          setAuthStatus("退出失败：网络异常。", true);
        } finally {
          logoutBtn.disabled = false;
        }
      });

      refreshDocsBtn.addEventListener("click", async () => {
        await refreshDocuments();
      });

      uploadBtn.addEventListener("click", async () => {
        if (!currentUser) {
          setUploadStatus("请先登录。", true);
          return;
        }
        if (!currentUser.can_manage_documents) {
          setUploadStatus("当前账号无文档管理权限，请使用 teaching_demo。", true);
          return;
        }
        const file = fileInput.files?.[0];
        if (!file) {
          setUploadStatus("请先选择文件。", true);
          return;
        }

        const formData = new FormData();
        formData.append("space", spaceSelect.value);
        formData.append("file", file);

        uploadBtn.disabled = true;
        setUploadStatus("上传中...");
        try {
          const response = await fetch("/documents", {
            method: "POST",
            credentials: "same-origin",
            body: formData,
          });
          const data = await response.json();
          if (!response.ok) {
            setUploadStatus(`上传失败：${data.detail || "未知错误"}`, true);
            return;
          }
          setUploadStatus(
            `上传成功：${data.title}，状态 ${data.status}，切片数 ${data.chunk_count}`
          );
          await refreshDocuments();
        } catch (_error) {
          setUploadStatus("上传失败：网络异常。", true);
        } finally {
          uploadBtn.disabled = false;
        }
      });

      askBtn.addEventListener("click", async () => {
        if (!currentUser) {
          setAskStatus("请先登录后再提问。", true);
          return;
        }
        const question = questionInput.value.trim();
        if (!question) {
          setAskStatus("请输入问题。", true);
          return;
        }

        askBtn.disabled = true;
        setAskStatus("提问中...");
        answerEl.textContent = "";
        ownerInfoEl.textContent = "";
        sourcesEl.innerHTML = "";

        try {
          const response = await fetch("/ask", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await response.json();
          if (response.status === 401) {
            currentUser = null;
            renderCurrentUser();
            setAskStatus("未登录，请先登录。", true);
            answerEl.textContent = "请求失败";
            return;
          }
          if (!response.ok) {
            setAskStatus(`提问失败：${data.detail || "未知错误"}`, true);
            answerEl.textContent = "请求失败";
            return;
          }

          answerEl.textContent = data.answer;
          if (data.owner && data.owner.configured) {
            ownerInfoEl.textContent = `主题负责人：${data.owner.name}（${data.owner.topic_name}），联系方式：${data.owner.contact}`;
          } else if (data.owner && data.owner.configured === false) {
            ownerInfoEl.textContent = "该问题未配置主题负责人。";
          } else if (data.ticket_id) {
            ownerInfoEl.textContent = `已创建学员工单：${data.ticket_id}`;
          } else {
            ownerInfoEl.textContent = "";
          }
          if (!data.sources || data.sources.length === 0) {
            sourcesEl.innerHTML = "<li>无来源</li>";
          } else {
            for (const source of data.sources) {
              const item = document.createElement("li");
              item.textContent = `${source.title} (${source.space_id})`;
              sourcesEl.appendChild(item);
            }
          }
          setAskStatus(data.hit ? "命中知识库。" : "未命中知识库，已拒答。");
        } catch (_error) {
          setAskStatus("提问失败：网络异常。", true);
          answerEl.textContent = "请求失败";
        } finally {
          askBtn.disabled = false;
        }
      });

      refreshMe();
    </script>
  </body>
</html>
